# Tagent Helm Chart — Default Values
# helm install tagent ./helm-charts/tagent --namespace tagent --create-namespace

createNamespace: false

# ===== SERVICES (Docker Hub: yaswanth111) =====

apiGateway:
  replicaCount: 1
  image:
    repository: yaswanth111/tagent-api-gateway
    tag: "latest"
    pullPolicy: Always
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

discovery:
  image:
    repository: yaswanth111/tagent-discovery
    tag: "latest"
    pullPolicy: Always
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

monitoring:
  image:
    repository: yaswanth111/tagent-monitoring
    tag: "latest"
    pullPolicy: Always
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

aiEngine:
  image:
    repository: yaswanth111/tagent-ai-engine
    tag: "latest"
    pullPolicy: Always
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 512Mi }

remediation:
  image:
    repository: yaswanth111/tagent-remediation
    tag: "latest"
    pullPolicy: Always
  mode: "read-only"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

notification:
  image:
    repository: yaswanth111/tagent-notification
    tag: "latest"
    pullPolicy: Always
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

web:
  replicaCount: 1
  image:
    repository: yaswanth111/tagent-web
    tag: "latest"
    pullPolicy: Always
  apiUrl: "http://tagent-api-gateway:8080"
  service:
    # ── Web UI access ────────────────────────────────────────────────────
    # METHOD 1 (default): NodePort — access directly at http://<NodeIP>:31777
    #   Works on the node's own IP + port. On a private-node cluster, run
    #   the port-forward helper on your bastion/EC2 to reach it (METHOD 3).
    # METHOD 2 (optional): LoadBalancer — a cloud LB is provisioned and the
    #   UI is reached via the LB address (NOT the node/EC2 IP). Enable with:
    #     --set web.service.type=LoadBalancer
    # METHOD 3 (any type): port-forward from a machine that can reach the
    #   cluster (e.g. EC2 bastion), no chart change required:
    #     kubectl port-forward -n tagent svc/tagent-web 7777:7777 --address 0.0.0.0
    type: NodePort
    # Service port exposed by the Service.
    port: 7777
    # Fixed NodePort so the URL is predictable (http://<NodeIP>:31777).
    # Managed clusters (EKS/GKE/AKS) only allow NodePorts in 30000-32767,
    # so the default sits in that range and works everywhere (EKS, GKE, AKS,
    # k3s, kind, kubeadm). Change it if you need a different port.
    nodePort: 31777
    # Cloud-provider annotations applied only when type=LoadBalancer.
    annotations: {}
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# ===== METRICS SERVER (auto-installs for real CPU/Memory data) =====

metricsServer:
  enabled: true

# ===== LOCAL LLM (no cloud APIs) =====

ollama:
  enabled: true
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  model: "llama3.2:1b"
  embeddingModel: "nomic-embed-text"
  persistence:
    enabled: false
    size: 20Gi
    storageClass: ""

# ===== NIGHT GUARDIAN =====

nightGuardian:
  enabled: false
  confidence: "85"

# ===== ESCALATION =====

escalation:
  enabled: false
  phoneDelayMin: "3"
  autoFixDelayMin: "10"
  quietStart: "22:00"
  quietEnd: "06:00"
  minSeverity: "high"

# ===== SECRETS =====

secrets:
  databaseUrl: "postgresql://tagent:tagent123@tagent-postgres:5432/tagent?sslmode=disable"
  redisUrl: "redis://tagent-redis:6379"
  kafkaBrokers: "tagent-kafka:9092"
  slackWebhookUrl: ""
  smtpHost: ""
  smtpUser: ""
  smtpPassword: ""

# ===== KAFKA =====

kafka:
  enabled: true
  persistence:
    enabled: false
    size: 5Gi

# ===== POSTGRESQL =====

postgres:
  enabled: true
  password: "tagent123"
  persistence:
    enabled: false
    size: 5Gi

# ===== PROMETHEUS =====

prometheus:
  serviceMonitor:
    enabled: false # Set to true if you have Prometheus Operator installed

# ===== INGRESS =====

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tagent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ===== RBAC =====

rbac:
  create: true

# ===== IMAGE PULL SECRETS (not needed for Docker Hub public images) =====

imagePullSecrets: []
