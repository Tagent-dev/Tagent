name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.0)"
        required: true
        default: "0.3.0"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release-github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline --no-merges)
          else
            CHANGELOG=$(git log --oneline --no-merges ${PREV_TAG}..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Tagent ${{ github.ref_name }}"
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ## Installation
            ```bash
            helm repo add tagent https://tagent-dev.github.io/Tagent
            helm repo update
            helm install tagent tagent/tagent --namespace tagent --create-namespace
            ```

            ## Docker Images
            ```
            yaswanth111/tagent-api-gateway:${{ github.ref_name }}
            yaswanth111/tagent-discovery:${{ github.ref_name }}
            yaswanth111/tagent-monitoring:${{ github.ref_name }}
            yaswanth111/tagent-ai-engine:${{ github.ref_name }}
            yaswanth111/tagent-remediation:${{ github.ref_name }}
            yaswanth111/tagent-notification:${{ github.ref_name }}
            yaswanth111/tagent-web:${{ github.ref_name }}
            ```
          generate_release_notes: true

  release-helm:
    runs-on: ubuntu-latest
    needs: release-github
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: azure/setup-helm@v5
        with:
          version: v3.14.0
      - name: Package and publish chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          TAG="tagent-${VERSION}"

          mkdir -p .cr-release-packages
          helm package helm-charts/tagent -d .cr-release-packages

          gh release upload "${{ github.ref_name }}" .cr-release-packages/*.tgz --clobber 2>/dev/null || true

          REPO_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          helm repo index .cr-release-packages --url "$REPO_URL"
          cp .cr-release-packages/index.yaml /tmp/index.yaml

          git checkout gh-pages
          cp /tmp/index.yaml index.yaml
          git add index.yaml
          git commit -m "Release chart ${VERSION}" --allow-empty
          git push origin gh-pages

  release-cli:
    runs-on: ubuntu-latest
    needs: release-github
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: Build CLI
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          cd cli
          go mod tidy
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o ../tagent-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} .
      - name: Upload binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            tagent-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
