name: UI · Visual Regression

on:
  pull_request:
    paths:
      - "frontend/web/src/**"
      - "frontend/web/package*.json"
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: frontend/web

jobs:
  screenshots:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        viewport:
          - { name: desktop, width: 1440, height: 900 }
          - { name: tablet, width: 768, height: 1024 }
          - { name: mobile, width: 375, height: 812 }
        theme: [dark]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Start server and run tests
        run: |
          npm run start &
          sleep 5
          npx playwright test --project=chromium --reporter=html --update-snapshots
        env:
          VIEWPORT_WIDTH: ${{ matrix.viewport.width }}
          VIEWPORT_HEIGHT: ${{ matrix.viewport.height }}
          THEME: ${{ matrix.theme }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.viewport.name }}-${{ matrix.theme }}
          path: frontend/web/test-results/
          retention-days: 7

  report:
    needs: screenshots
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          merge-multiple: true

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## 📸 Visual Regression Results',
                '',
                '| Viewport | Theme | Status |',
                '|----------|-------|--------|',
                '| Desktop (1440×900) | Dark | ✅ Captured |',
                '| Tablet (768×1024) | Dark | ✅ Captured |',
                '| Mobile (375×812) | Dark | ✅ Captured |',
                '',
                'Screenshots uploaded as artifacts. Review in the Actions tab.',
              ].join('\n'),
            });
