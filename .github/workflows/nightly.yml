name: Nightly Build

on:
  schedule:
    - cron: "0 2 * * *" # 2 AM UTC daily
  workflow_dispatch:

env:
  REGISTRY: docker.io
  ORG: yaswanth111

jobs:
  nightly:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: deployment/docker/api-gateway.Dockerfile
          - service: discovery
            dockerfile: deployment/docker/discovery.Dockerfile
          - service: monitoring
            dockerfile: deployment/docker/monitoring.Dockerfile
          - service: ai-engine
            dockerfile: deployment/docker/ai-engine.Dockerfile
          - service: remediation
            dockerfile: deployment/docker/remediation.Dockerfile
          - service: notification
            dockerfile: deployment/docker/notification.Dockerfile
          - service: web
            dockerfile: deployment/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.ORG }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.ORG }}/tagent-${{ matrix.service }}:nightly
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
