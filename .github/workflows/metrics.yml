name: Repository Metrics

on:
  schedule:
    - cron: "0 8 * * 1" # Monday 8 AM UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const { data: openPRs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const issues = openIssues.filter(i => !i.pull_request);
            const staleIssues = issues.filter(i => i.labels.some(l => l.name === 'lifecycle/stale'));
            const stalePRs = openPRs.filter(p => p.labels && p.labels.some(l => l.name === 'lifecycle/stale'));
            const needsTriage = issues.filter(i => i.labels.some(l => l.name === 'needs-triage'));

            const now = new Date();
            const avgAge = issues.length > 0
              ? Math.round(issues.reduce((sum, i) => sum + (now - new Date(i.created_at)) / (1000*60*60*24), 0) / issues.length)
              : 0;

            const report = [
              `## 📊 Weekly Repository Health Report`,
              ``,
              `| Metric | Count |`,
              `|--------|-------|`,
              `| Open Issues | ${issues.length} |`,
              `| Open PRs | ${openPRs.length} |`,
              `| Stale Issues | ${staleIssues.length} |`,
              `| Stale PRs | ${stalePRs.length} |`,
              `| Needs Triage | ${needsTriage.length} |`,
              `| Avg Issue Age | ${avgAge} days |`,
              ``,
              `*Generated ${now.toISOString().split('T')[0]}*`,
            ].join('\n');

            console.log(report);

            // Create or update a pinned issue with the report
            const title = '📊 Repository Health Dashboard';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'meta/dashboard',
              per_page: 1,
            });

            if (existing.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: report,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: report,
                labels: ['meta/dashboard'],
              });
            }
