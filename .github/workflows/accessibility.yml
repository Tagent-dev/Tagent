name: UI · Accessibility

on:
  pull_request:
    paths:
      - "frontend/web/src/**"
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: frontend/web

jobs:
  axe-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        page:
          - { path: "/", name: "Dashboard" }
          - { path: "/incidents", name: "Incidents" }
          - { path: "/pods", name: "Pods" }
          - { path: "/ai", name: "AI Chat" }
          - { path: "/settings", name: "Settings" }
          - { path: "/briefing", name: "Briefing" }
          - { path: "/nodes", name: "Nodes" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx playwright install --with-deps chromium

      - name: Build and start
        run: |
          npm run build
          npm run start &
          npx wait-on http://localhost:3000 --timeout 30000
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Run axe accessibility scan
        run: |
          npx @axe-core/cli http://localhost:3000${{ matrix.page.path }} \
            --exit \
            --save results-${{ matrix.page.name }}.json \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
            --disable color-contrast || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-${{ matrix.page.name }}
          path: frontend/web/results-*.json
          retention-days: 7

  report:
    needs: axe-scan
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: a11y-*
          merge-multiple: true

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = fs.readdirSync('.').filter(f => f.startsWith('results-'));
            let violations = 0;
            let rows = [];

            for (const file of files) {
              try {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                const page = file.replace('results-', '').replace('.json', '');
                const count = Array.isArray(data) ? data.reduce((s, r) => s + (r.violations?.length || 0), 0) : 0;
                violations += count;
                rows.push(`| ${page} | ${count === 0 ? '✅ Pass' : `⚠️ ${count} issues`} |`);
              } catch (e) {
                rows.push(`| ${file} | ❓ Parse error |`);
              }
            }

            const body = [
              '## ♿ Accessibility Report',
              '',
              '| Page | Status |',
              '|------|--------|',
              ...rows,
              '',
              `**Total violations:** ${violations}`,
              violations === 0 ? '✅ All pages pass WCAG 2.1 AA' : '⚠️ Review accessibility issues above',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
