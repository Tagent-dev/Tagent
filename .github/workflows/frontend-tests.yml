name: UI · Tests

on:
  push:
    branches: [main]
    paths:
      - "frontend/web/src/**"
      - "frontend/web/package*.json"
  pull_request:
    paths:
      - "frontend/web/src/**"
      - "frontend/web/package*.json"
  workflow_dispatch:

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

defaults:
  run:
    working-directory: frontend/web

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Run unit tests
        run: npx vitest run --coverage --reporter=json --outputFile=test-results.json
        continue-on-error: true
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: frontend/web/coverage/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: TypeScript strict check
        run: npx tsc --noEmit --strict

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: ESLint
        run: npx eslint src/ --format json --output-file eslint-report.json
        continue-on-error: true
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eslint-report
          path: frontend/web/eslint-report.json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Check bundle size
        run: |
          SIZE=$(du -sh .next | cut -f1)
          echo "## 📦 Bundle Size: ${SIZE}" >> $GITHUB_STEP_SUMMARY
