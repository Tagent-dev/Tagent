name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, discovery, monitoring, remediation, notification]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: Tidy
        working-directory: backend/services/${{ matrix.service }}
        run: go mod tidy
      - name: Build
        working-directory: backend/services/${{ matrix.service }}
        run: go build ./...
      - name: Test
        working-directory: backend/services/${{ matrix.service }}
        run: go test ./... -v -short || true

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install deps
        working-directory: backend/services/ai-engine
        run: pip install -r requirements.txt ruff pytest pytest-asyncio
      - name: Lint
        working-directory: backend/services/ai-engine
        run: ruff check .
      - name: Test
        working-directory: backend/services/ai-engine
        run: pytest --tb=short -q || true

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
        working-directory: frontend/web
      - run: npm run type-check
        working-directory: frontend/web
      - run: npm run lint
        working-directory: frontend/web
      - run: npm run build
        working-directory: frontend/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  lint-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.14.0
      - run: helm lint helm-charts/tagent
      - run: helm template tagent helm-charts/tagent
